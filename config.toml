# The URL the site will be built for
base_url = "https://example.com"

# Site metadata
title = "Alex Developer"
description = "Portfolio, engineering projects, and technical writeups."

# Whether to compile Sass files
compile_sass = false

# Generate RSS feed
generate_feeds = true

[markdown.highlighting]
theme = "gruvbox-dark-soft"

[extra]
# Author Information
author_name = "Alex Dev"
