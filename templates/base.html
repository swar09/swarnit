<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  
  <!-- Gruvbox-friendly Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ get_url(path='css/style.css') | safe }}">
  {% block extra_head %}{% endblock extra_head %}
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="site-wrapper nav-container">
      <a href="{{ config.base_url }}" class="site-logo">
        <span class="prompt-symbol">λ</span> {{ config.extra.author_name | default(value="portfolio") }}
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="{{ get_url(path='@/_index.md') }}">Home</a></li>
          <li><a href="{{ get_url(path='projects/_index.md') }}">Projects</a></li>
          <li><a href="{{ get_url(path='blog/_index.md') }}">Blog</a></li>
          <li><a href="{{ get_url(path='about.md') }}">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="site-wrapper">
      {% block content %}{% endblock content %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="site-wrapper footer-content">
      <div class="footer-text">
        © {{ now() | date(format="%Y") }} {{ config.extra.author_name }}. Built with <a href="https://www.getzola.org" target="_blank" rel="noopener">Zola</a>.
      </div>
      <div>
        <a href="#top" class="back-to-top">↑ Back to top</a>
      </div>
    </div>
  </footer>

</body>
</html>
